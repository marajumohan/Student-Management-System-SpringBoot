# spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1 Outside Docker → localhost
# spring.datasource.url=jdbc:oracle:thin:@oracle-xe:1521/XEPDB1 Inside Docker (same network) → oracle-xe
spring.datasource.url=jdbc:oracle:thin:@oracle-xe:1521/XEPDB1
spring.datasource.username=STUDENT_APP
spring.datasource.password=password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true